name: AAP Resource Config
run-name: AAP - ${{ inputs.resources }}

on:
  workflow_dispatch:
    inputs:
      resources:
        description: 'Resources to deploy'
        required: true
        type: string
        default: '[
          "controller_projects",
          "controller_credentials",
          "controller_templates",
          "controller_schedules"
          ]'

jobs:
  playbook:
    name: Run Playbook
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install Galaxy requirements
      env:
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN: ${{ secrets.REDHATAUTOMATIONHUBTOKEN }}
        ANSIBLE_GALAXY_SERVER_UPSTREAM_GALAXY_URL: https://galaxy.ansible.com
        ANSIBLE_GALAXY_SERVER_LIST: automation_hub_certified,upstream_galaxy
      run: |
        ansible-galaxy collection install ansible.controller infra.aap_configuration
      shell: bash
      working-directory: ${{ github.workspace }}

    - name: Configure Resources
      run: |
        ansible-playbook playbooks/main.yml \
        --extra-vars "aap_hostname=https://${{ vars.AAP_HOSTNAME }}" \
        --extra-vars '{"resources": ${{ inputs.resources }}}' \
        --vault-password-file <(cat <<<"${{ secrets.ANSIBLE_VAULT }}")
      shell: bash
      working-directory: ${{ github.workspace }}